<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>长歌 · 本地文本编辑器</title>
<link rel="stylesheet" href="/ui.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><i></i></span>
      <div class="brand-text">
        <strong>长歌</strong>
        <small>LOCAL TEXT EDITOR</small>
      </div>
    </div>
    <div class="top-actions">
      <span id="dirty" class="dirty is-clean"><i></i><b>未修改</b></span>
      <button class="btn ghost" id="reset" type="button">还原此页</button>
      <button class="btn ghost" id="rebuild" type="button">重建站点</button>
      <button class="btn primary" id="save" type="button">保存并重建 <kbd>Ctrl S</kbd></button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="side-head">
        <span class="eyebrow">PAGES · 98</span>
        <h1>页面</h1>
        <p>改文字，不改结构。保存后会重新生成 <code>OfficialPage/</code>。</p>
      </div>
      <label class="search">
        <span>FIND</span>
        <input id="search" type="search" placeholder="搜索页面标题…" autocomplete="off" spellcheck="false">
      </label>
      <div id="page-list" class="page-list" role="list"></div>
      <div class="side-note">
        <span class="dot"></span>
        有补丁的页面
        <br>补丁存于 <code>editor/patches.json</code>
      </div>
    </aside>

    <section class="stage">
      <div class="stage-head">
        <div>
          <span class="eyebrow">EDITING</span>
          <div id="crumb" class="crumb">正在载入…</div>
        </div>
        <div class="hint">点击正文直接修改 · 链接已禁用</div>
      </div>
      <div class="frame-shell">
        <div id="frame-empty" class="frame-empty">
          <span class="eyebrow">NO PAGE</span>
          <p>从左边选一个页面。</p>
        </div>
        <iframe id="frame" title="官方页预览"></iframe>
      </div>
      <div class="statusbar">
        <span id="status">准备就绪</span>
        <span id="build-info"></span>
      </div>
    </section>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="/ui.js"></script>
</body>
</html>
